[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "steel-faults-study"
version = "0.1.0"
description = "Reproducible seven-class steel defect study with honest uncertainty"
requires-python = ">=3.11,<3.15"
readme = "README.md"
license = "MIT"
authors = [{name = "GzoC"}]
dependencies = ["numpy>=2,<3", "pandas>=2.2,<3", "scikit-learn>=1.7,<1.10", "joblib>=1.4,<2", "streamlit>=1.50,<2"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1", "nbformat>=5,<6", "nbclient>=0.10,<1", "ipykernel>=6,<8"]

[project.scripts]
steel-faults = "steel_faults.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["steel_faults*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
